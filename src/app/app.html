<header class="top-bar">
  <app-search-box />
  <nav class="wide-nav">
    @for (section of sections; track section.path) {
      <a [routerLink]="section.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: section.exact }">
        {{ section.label }}
      </a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<nav class="tab-bar">
  @for (section of sections; track section.path) {
    <a [routerLink]="section.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: section.exact }">
      <app-icon [name]="section.icon" />
      <span>{{ section.label }}</span>
    </a>
  }
</nav>
